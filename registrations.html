<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registrations - CampusConnect</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6fa;
            color: #1f2937;
        }

        .header {
            background: linear-gradient(135deg, #4169e1, #2f49b0);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 { margin: 0 0 8px; font-size: 32px; }
        .header p { margin: 0; font-size: 16px; }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #2f49b0;
            font-weight: bold;
            text-decoration: none;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        label { font-weight: bold; display: block; margin-bottom: 8px; }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .summary {
            margin-bottom: 16px;
            font-weight: bold;
            color: #2f49b0;
        }

        .table-wrap { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th { background: #eef2ff; color: #1e3a8a; }

        .message {
            padding: 16px;
            text-align: center;
            color: #6b7280;
        }

        .error { color: #b91c1c; }
    </style>
</head>

<body>

    <div class="header">
        <h1>Student Registrations</h1>
        <p>See which students have registered for each event.</p>
    </div>

    <div class="container">

        <a class="back-link" href="organizer-dashboard.html">&larr; Back to Organizer Dashboard</a>

        <div class="card">

            <label for="eventSelect">Select an event</label>
            <select id="eventSelect">
                <option value="">Loading events...</option>
            </select>

            <div class="summary" id="summary"></div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Student ID</th>
                            <th>Student Name</th>
                            <th>Student Email</th>
                            <th>Registration Date</th>
                        </tr>
                    </thead>
                    <tbody id="registrationBody"></tbody>
                </table>
            </div>

            <div class="message" id="message"></div>

        </div>
    </div>

    <script>
        const eventSelect = document.getElementById("eventSelect");
        const summary = document.getElementById("summary");
        const tableBody = document.getElementById("registrationBody");
        const message = document.getElementById("message");

        function showMessage(text, isError) {
            message.textContent = text;
            message.className = isError ? "message error" : "message";
        }

        function addCell(row, text) {
            const cell = document.createElement("td");
            cell.textContent = text;
            row.appendChild(cell);
        }

        async function loadEvents() {
            try {
                const response = await fetch("/events");

                if (!response.ok) {
                    throw new Error("Could not load events.");
                }

                const events = await response.json();

                eventSelect.innerHTML = "";

                if (events.length === 0) {
                    const option = document.createElement("option");
                    option.value = "";
                    option.textContent = "No events available";
                    eventSelect.appendChild(option);
                    showMessage("There are no events yet.", false);
                    return;
                }

                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = "-- Choose an event --";
                eventSelect.appendChild(placeholder);

                events.forEach(function (event) {
                    const option = document.createElement("option");
                    option.value = event.eventId;
                    option.textContent = event.title + " (" + event.date + ")";
                    eventSelect.appendChild(option);
                });

                const urlEventId = new URLSearchParams(window.location.search).get("eventId");

                if (urlEventId) {
                    eventSelect.value = urlEventId;
                    loadRegistrations();
                } else {
                    showMessage("Please choose an event to see its registrations.", false);
                }

            } catch (error) {
                showMessage("Could not load events. Please refresh the page.", true);
            }
        }

        async function loadRegistrations() {
            const eventId = eventSelect.value;

            tableBody.innerHTML = "";
            summary.textContent = "";

            if (!eventId) {
                showMessage("Please choose an event to see its registrations.", false);
                return;
            }

            showMessage("Loading registrations...", false);

            try {
                const response = await fetch("/registrations?eventId=" + encodeURIComponent(eventId));

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const registrations = await response.json();

                if (registrations.length === 0) {
                    showMessage("No students have registered for this event yet.", false);
                    return;
                }

                registrations.forEach(function (item, index) {
                    const row = document.createElement("tr");

                    addCell(row, String(index + 1));
                    addCell(row, String(item.studentId));
                    addCell(row, item.studentName);
                    addCell(row, item.studentEmail);
                    addCell(row, item.registrationDate);

                    tableBody.appendChild(row);
                });

                summary.textContent = "Total registered students: " + registrations.length;
                showMessage("", false);

            } catch (error) {
                showMessage("Could not load registrations. Please try again.", true);
            }
        }

        eventSelect.addEventListener("change", loadRegistrations);

        loadEvents();
    </script>

</body>
</html>
