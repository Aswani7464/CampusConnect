</main>

<script>
    const API_URL = window.location.origin;

    const studentId = localStorage.getItem("campusStudentId");

    let notifications = [];
    let currentFilter = "all";

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function getCategory(notification) {
        const text = (
            (notification.title || "") + " " +
            (notification.message || "")
        ).toLowerCase();

        if (text.includes("certificate")) return "certificate";
        if (text.includes("attendance")) return "attendance";
        if (text.includes("registration") || text.includes("registered")) return "registration";
        if (text.includes("announcement")) return "announcement";

        return "event";
    }

    function getIcon(category) {
        const icons = {
            event: "🎉",
            registration: "✅",
            certificate: "🏆",
            attendance: "📋",
            announcement: "📢"
        };

        return icons[category] || "🔔";
    }

    function updateStatistics() {
        const unread = notifications.filter(n => !n.read).length;

        document.getElementById("totalCount").textContent = notifications.length;
        document.getElementById("unreadCount").textContent = unread;
        document.getElementById("readCount").textContent = notifications.length - unread;
    }

    async function loadNotifications() {
        const list = document.getElementById("notificationList");
        const error = document.getElementById("errorMessage");

        if (!studentId) {
            list.innerHTML = `
                <div class="empty">
                    <div>🔐</div>
                    <h3>Please log in first</h3>
                    <p>Your student account is required to view notifications.</p>
                </div>
            `;
            return;
        }

        try {
            error.style.display = "none";

            const response = await fetch(
                `${API_URL}/notifications?studentId=${encodeURIComponent(studentId)}`
            );

            if (!response.ok) {
                throw new Error("Unable to load notifications. Server returned " + response.status);
            }

            notifications = await response.json();

            if (!Array.isArray(notifications)) {
                throw new Error("Invalid notification data received from server.");
            }

            updateStatistics();
            renderNotifications();

        } catch (err) {
            error.textContent = err.message;
            error.style.display = "block";

            list.innerHTML = `
                <div class="empty">
                    <div>⚠️</div>
                    <h3>Unable to load notifications</h3>
                    <p>Make sure the CampusConnect Java server is running.</p>
                    <button class="read-all" style="margin-top:15px" onclick="loadNotifications()">
                        Try Again
                    </button>
                </div>
            `;
        }
    }

    function renderNotifications() {
        const list = document.getElementById("notificationList");

        let filtered = notifications;

        if (currentFilter !== "all") {
            filtered = notifications.filter(
                n => getCategory(n) === currentFilter
            );
        }

        if (filtered.length === 0) {
            list.innerHTML = `
                <div class="empty">
                    <div>📭</div>
                    <h3>No notifications found</h3>
                    <p>New updates will appear here.</p>
                </div>
            `;
            return;
        }

        list.innerHTML = filtered.map(n => {
            const category = getCategory(n);
            const title = escapeHTML(n.title || "Campus Update");
            const message = escapeHTML(n.message || "");
            const date = escapeHTML(n.createdAt || "");
            const eventDate = escapeHTML(n.eventDate || "");
            const venue = escapeHTML(n.venue || "");

            return `
                <article class="notification ${n.read ? "" : "unread"}">

                    <div class="icon">${getIcon(category)}</div>

                    <div class="notification-content">
                        <h3>${title}</h3>
                        <p>${message}</p>

                        <span class="badge">${category.toUpperCase()}</span>

                        <div class="meta">
                            <span>🕒 ${date || "Recently"}</span>
                            ${eventDate ? `<span>📅 Event: ${eventDate}</span>` : ""}
                            ${venue ? `<span>📍 ${venue}</span>` : ""}
                        </div>
                    </div>

                    <div class="notification-actions">
                        ${n.read
                            ? `<span style="color:#29945c;font-size:12px">✓ Read</span>`
                            : `<button class="action-btn" onclick="markAsRead(${Number(n.notificationId)})">Mark as read</button>`
                        }
                    </div>

                </article>
            `;
        }).join("");
    }

    function filterNotifications(category, button) {
        currentFilter = category;

        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");
        renderNotifications();
    }

    async function markAsRead(notificationId) {
        try {
            const response = await fetch(`${API_URL}/mark-notification-read`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    studentId: Number(studentId),
                    notificationId: notificationId
                })
            });

            if (!response.ok) {
                throw new Error("Could not update notification.");
            }

            const notification = notifications.find(
                n => Number(n.notificationId) === notificationId
            );

            if (notification) {
                notification.read = true;
            }

            updateStatistics();
            renderNotifications();

        } catch (err) {
            alert(err.message);
        }
    }

    async function markAllAsRead() {
        const unread = notifications.filter(n => !n.read);

        if (unread.length === 0) {
            alert("All notifications are already read.");
            return;
        }

        for (const notification of unread) {
            try {
                const response = await fetch(`${API_URL}/mark-notification-read`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        studentId: Number(studentId),
                        notificationId: Number(notification.notificationId)
                    })
                });

                if (!response.ok) {
                    throw new Error("Some notifications could not be updated.");
                }

                notification.read = true;

            } catch (err) {
                updateStatistics();
                renderNotifications();
                alert(err.message);
                return;
            }
        }

        updateStatistics();
        renderNotifications();
    }

    loadNotifications();
</script>
