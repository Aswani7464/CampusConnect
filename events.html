<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Events - CampusConnect</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1e293b;
        }

        nav {
            background: #2563eb;
            color: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 6px;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .navigation {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .navigation a,
        .navigation button {
            border: 0;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            background: #64748b;
            font-size: 14px;
        }

        .navigation a {
            background: #2563eb;
        }

        h1 {
            margin-bottom: 8px;
        }

        .intro {
            color: #64748b;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .search-panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 18px #0000000c;
        }

        .search-controls {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 14px;
        }

        .field label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #334155;
        }

        .field input,
        .field select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            background: white;
            color: #1e293b;
        }

        .search-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        #resultCount {
            color: #64748b;
            font-size: 14px;
        }

        #clearFilters {
            border: 0;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 10px 14px;
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
        }

        #notification {
            display: none;
            padding: 15px 18px;
            margin: 20px 0;
            border-radius: 8px;
            font-weight: bold;
            line-height: 1.5;
        }

        .events {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #0000000c;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card h2 {
            color: #1d4ed8;
            margin: 0;
            overflow-wrap: anywhere;
        }

        .card p {
            line-height: 1.6;
            color: #475569;
            margin: 3px 0;
            overflow-wrap: anywhere;
        }

        .category {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            align-self: flex-start;
        }

        .register {
            border: 0;
            background: #2563eb;
            color: white;
            padding: 12px 16px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            margin-top: auto;
        }

        .register:hover {
            background: #1d4ed8;
        }

        .register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty,
        .loading {
            background: white;
            padding: 30px;
            border-radius: 12px;
            color: #64748b;
            text-align: center;
            grid-column: 1 / -1;
            line-height: 1.6;
        }

        /* Registration modal */

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background: rgba(15, 23, 42, 0.65);
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 10px 35px #00000030;
            margin: auto;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #1d4ed8;
        }

        .modal-content p {
            color: #64748b;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-field {
            margin-bottom: 14px;
        }

        .form-field.full {
            grid-column: 1 / -1;
        }

        .form-field label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #334155;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .submit-btn,
        .cancel-btn {
            flex: 1;
            padding: 13px;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
        }

        .submit-btn {
            background: #2563eb;
            color: white;
        }

        .cancel-btn {
            background: #e2e8f0;
            color: #334155;
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        footer {
            margin-top: 45px;
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 22px;
        }

        @media (max-width: 650px) {
            .search-controls,
            .form-grid {
                grid-template-columns: 1fr;
            }

            nav {
                align-items: flex-start;
                flex-direction: column;
            }

            .form-field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">CampusConnect</div>

    <div>
        <a href="index.html">Home</a>
        <a href="student-dashboard.html">Dashboard</a>
        <a href="my-events.html">My Events</a>
        <a href="student-details.html">My Profile</a>
    </div>
</nav>

<main>

    <div class="navigation">
        <button onclick="history.back()">← Back</button>
        <a href="index.html">⌂ Home</a>
    </div>

    <h1>Discover Campus Events</h1>

    <p class="intro">
        Search for events, explore categories, and register for your next campus experience.
    </p>

    <section class="search-panel">

        <div class="search-controls">

            <div class="field">
                <label for="searchInput">Search Events</label>
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search by event name, venue, organizer..."
                    autocomplete="off"
                >
            </div>

            <div class="field">
                <label for="categoryFilter">Filter by Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                </select>
            </div>

        </div>

        <div class="search-bottom">
            <span id="resultCount">Loading events...</span>
            <button type="button" id="clearFilters">Clear Search</button>
        </div>

    </section>

    <div id="notification" role="status" aria-live="polite"></div>

    <section id="eventsList" class="events">
        <div class="loading">Loading campus events...</div>
    </section>

</main>

<!-- Student Registration Form -->

<div class="modal" id="registrationModal">

    <div class="modal-content">

        <h2>Student Event Registration</h2>

        <p id="selectedEventName"></p>

        <form id="registrationForm">

            <div class="form-grid">

                <div class="form-field">
                    <label for="fullName">Full Name *</label>
                    <input
                        type="text"
                        id="fullName"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="registerNumber">Register Number *</label>
                    <input
                        type="text"
                        id="registerNumber"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="studentEmail">Email Address *</label>
                    <input
                        type="email"
                        id="studentEmail"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="phoneNumber">Phone Number *</label>
                    <input
                        type="tel"
                        id="phoneNumber"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        placeholder="10-digit mobile number"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="department">Department *</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="CSE">Computer Science and Engineering</option>
                        <option value="IT">Information Technology</option>
                        <option value="ECE">Electronics and Communication</option>
                        <option value="EEE">Electrical and Electronics</option>
                        <option value="MECH">Mechanical Engineering</option>
                        <option value="CIVIL">Civil Engineering</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="studyYear">Year of Study *</label>
                    <select id="studyYear" required>
                        <option value="">Select Year</option>
                        <option value="1">First Year</option>
                        <option value="2">Second Year</option>
                        <option value="3">Third Year</option>
                        <option value="4">Fourth Year</option>
                    </select>
                </div>

            </div>

            <div class="form-buttons">

                <button type="button"
                        class="cancel-btn"
                        id="cancelRegistration">
                    Cancel
                </button>

                <button type="submit"
                        class="submit-btn"
                        id="submitRegistration">
                    Submit Registration
                </button>

            </div>

        </form>

    </div>

</div>

<footer>
    © 2026 CampusConnect. All rights reserved.
</footer>

<script>
    const eventsList = document.getElementById("eventsList");
    const searchInput = document.getElementById("searchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const resultCount = document.getElementById("resultCount");
    const clearFilters = document.getElementById("clearFilters");

    const registrationModal =
        document.getElementById("registrationModal");

    const registrationForm =
        document.getElementById("registrationForm");

    const submitRegistration =
        document.getElementById("submitRegistration");

    let allEvents = [];
    let selectedEvent = null;
    let selectedButton = null;

    function showNotification(message, success) {
        const box = document.getElementById("notification");

        box.textContent = message;
        box.style.display = "block";
        box.style.background = success ? "#dcfce7" : "#fee2e2";
        box.style.color = success ? "#166534" : "#991b1b";
        box.style.border = success
            ? "1px solid #86efac"
            : "1px solid #fca5a5";

        box.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });
    }

    function addTextElement(parent, tag, className, text) {
        const element = document.createElement(tag);

        if (className) {
            element.className = className;
        }

        element.textContent = text ?? "";
        parent.appendChild(element);

        return element;
    }

    function formatDate(dateString) {
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateString || "");

        if (!match) {
            return dateString || "Not specified";
        }

        const date = new Date(
            Number(match[1]),
            Number(match[2]) - 1,
            Number(match[3])
        );

        return date.toLocaleDateString("en-IN", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });
    }

    function populateCategories() {
        const categories = [
            ...new Set(
                allEvents
                    .map(event => (event.category || "").trim())
                    .filter(Boolean)
            )
        ].sort((a, b) => a.localeCompare(b));

        categoryFilter.replaceChildren();

        const allOption = document.createElement("option");
        allOption.value = "";
        allOption.textContent = "All Categories";
        categoryFilter.appendChild(allOption);

        categories.forEach(category => {
            const option = document.createElement("option");
            option.value = category;
            option.textContent = category;
            categoryFilter.appendChild(option);
        });
    }

    function renderEvents() {
        const searchTerm = searchInput.value.trim().toLowerCase();
        const selectedCategory = categoryFilter.value;

        const filteredEvents = allEvents.filter(event => {
            const searchableText = [
                event.title,
                event.description,
                event.venue,
                event.organizerName,
                event.category
            ].join(" ").toLowerCase();

            return searchableText.includes(searchTerm) &&
                (!selectedCategory || event.category === selectedCategory);
        });

        resultCount.textContent =
            "Showing " + filteredEvents.length +
            " of " + allEvents.length + " events";

        eventsList.replaceChildren();

        if (filteredEvents.length === 0) {
            addTextElement(
                eventsList,
                "div",
                "empty",
                "No matching events found. Try another search or clear your filters."
            );
            return;
        }

        filteredEvents.forEach(event => {
            const card = document.createElement("article");
            card.className = "card";

            addTextElement(card, "span", "category", event.category);
            addTextElement(card, "h2", "", event.title);
            addTextElement(card, "p", "", event.description);

            addTextElement(card, "p", "", "Date: " + formatDate(event.date));
            addTextElement(card, "p", "", "Time: " + (event.time || "Not specified"));
            addTextElement(card, "p", "", "Venue: " + (event.venue || "Not specified"));
            addTextElement(card, "p", "", "Organizer: " + (event.organizerName || "Not specified"));

            const studentLimit = Number(event.studentLimit ?? 100000);
            const registeredCount = Number(event.registeredCount ?? 0);
            const availableSeats = Math.max(
                0,
                Number(event.availableSeats ?? studentLimit - registeredCount)
            );

            const eventFee = Number(event.eventFee ?? 0);

            addTextElement(card, "p", "", "Maximum Seats: " + studentLimit);
            addTextElement(card, "p", "", "Registered Students: " + registeredCount);

            const seatsElement = addTextElement(
                card,
                "p",
                "",
                availableSeats === 0
                    ? "Fully Booked"
                    : "Seats Available: " + availableSeats
            );

            seatsElement.style.fontWeight = "bold";
            seatsElement.style.color =
                availableSeats === 0 ? "#dc2626" : "#15803d";

            const feeElement = addTextElement(
                card,
                "p",
                "",
                eventFee === 0 ? "Event Fee: FREE" : "Event Fee: ₹" + eventFee
            );

            feeElement.style.fontWeight = "bold";
            feeElement.style.color = "#2563eb";

            const registerButton = document.createElement("button");
            registerButton.className = "register";
            registerButton.dataset.eventFee = String(eventFee);

            if (availableSeats === 0) {
                registerButton.textContent = "Fully Booked";
                registerButton.disabled = true;
            } else {
                registerButton.textContent = "Register Now";

                registerButton.addEventListener("click", () => {
                    openRegistrationForm(event, registerButton);
                });
            }

            card.appendChild(registerButton);
            eventsList.appendChild(card);
        });
    }

    async function loadEvents() {
        eventsList.replaceChildren();

        addTextElement(
            eventsList,
            "div",
            "loading",
            "Loading campus events..."
        );

        try {
            const response = await fetch("/events");

            if (!response.ok) {
                throw new Error("Unable to load events.");
            }

            const events = await response.json();

            if (!Array.isArray(events)) {
                throw new Error("Invalid event data.");
            }

            allEvents = events;
            populateCategories();
            renderEvents();

        } catch (error) {
            allEvents = [];

            eventsList.replaceChildren();

            addTextElement(
                eventsList,
                "div",
                "empty",
                "Could not load events. Please check that the Java server is running."
            );

            resultCount.textContent = "Events unavailable";
        }
    }

    function openRegistrationForm(event, button) {
        const studentId = localStorage.getItem("campusStudentId");

        if (!studentId) {
            showNotification(
                "Please log in using your student account before registering.",
                false
            );
            return;
        }

        selectedEvent = event;
        selectedButton = button;

        document.getElementById("selectedEventName").textContent =
            "Event: " + event.title;

        // Prefill name and email from the student login session.
        document.getElementById("fullName").value =
            localStorage.getItem("campusStudentName") || "";

        document.getElementById("studentEmail").value =
            localStorage.getItem("campusStudentEmail") || "";

        registrationForm.reset();

        // Restore the prefilled values after resetting the form.
        document.getElementById("fullName").value =
            localStorage.getItem("campusStudentName") || "";

        document.getElementById("studentEmail").value =
            localStorage.getItem("campusStudentEmail") || "";

        registrationModal.style.display = "flex";
    }

    function closeRegistrationForm() {
        registrationModal.style.display = "none";
        registrationForm.reset();
        selectedEvent = null;
        selectedButton = null;
    }

    document.getElementById("cancelRegistration")
        .addEventListener("click", closeRegistrationForm);

    registrationModal.addEventListener("click", function(event) {
        if (event.target === registrationModal) {
            closeRegistrationForm();
        }
    });

    registrationForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        if (!selectedEvent || !selectedButton) {
            showNotification("Please select an event first.", false);
            return;
        }

        const studentId = localStorage.getItem("campusStudentId");

        if (!studentId) {
            showNotification("Please log in first.", false);
            closeRegistrationForm();
            return;
        }

        const fullName = document.getElementById("fullName").value.trim();
        const registerNumber = document.getElementById("registerNumber").value.trim();
        const email = document.getElementById("studentEmail").value.trim();
        const phone = document.getElementById("phoneNumber").value.trim();
        const department = document.getElementById("department").value;
        const studyYear = document.getElementById("studyYear").value;

        if (!fullName || !registerNumber || !email ||
            !phone || !department || !studyYear) {
            showNotification("Please complete all student details.", false);
            return;
        }

        if (!/^[0-9]{10}$/.test(phone)) {
            showNotification("Please enter a valid 10-digit phone number.", false);
            return;
        }

        const eventFee = Number(selectedButton.dataset.eventFee || 0);

        submitRegistration.disabled = true;
        submitRegistration.textContent = "Registering...";

        try {
            const response = await fetch("/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: new URLSearchParams({
                    studentId: studentId,
                    eventId: String(selectedEvent.eventId),
                    eventName: selectedEvent.title,
                    fullName: fullName,
                    registerNumber: registerNumber,
                    email: email,
                    phone: phone,
                    department: department,
                    studyYear: studyYear
                })
            });

            const message = await response.text();

            if (response.status === 409) {
                showNotification(
                    "You have already registered for this event.",
                    false
                );
                closeRegistrationForm();
                return;
            }

            if (!response.ok) {
                showNotification(message || "Registration failed.", false);
                return;
            }

            if (/registration successful/i.test(message)) {
                if (eventFee > 0) {
                    alert(
                        "Demo payment successful!\n" +
                        "Amount: ₹" + eventFee +
                        "\nNo real money was charged."
                    );
                }

                showNotification(message, true);
                closeRegistrationForm();

                // Refresh seat counts after successful registration.
                await loadEvents();
            } else {
                showNotification(message, false);
            }

        } catch (error) {
            showNotification(
                "Could not complete registration. Please try again.",
                false
            );
        } finally {
            submitRegistration.disabled = false;
            submitRegistration.textContent = "Submit Registration";
        }
    });

    searchInput.addEventListener("input", renderEvents);
    categoryFilter.addEventListener("change", renderEvents);

    clearFilters.addEventListener("click", () => {
        searchInput.value = "";
        categoryFilter.value = "";
        renderEvents();
        searchInput.focus();
    });

    loadEvents();
</script>

</body>
</html>
