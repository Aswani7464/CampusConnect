<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registered Events - CampusConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fc;
            color: #172033;
            line-height: 1.6;
        }

        a {
            text-decoration: none;
        }

        .navbar {
            background: #172554;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: 800;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: white;
            font-size: 14px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: #93c5fd;
        }

        .hero {
            padding: 55px 7%;
            background: linear-gradient(120deg, #2443aa, #4778ee);
            color: white;
        }

        .hero-label {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #dbeafe;
        }

        .hero h1 {
            font-size: clamp(28px, 4vw, 40px);
            margin-bottom: 8px;
        }

        .hero p {
            color: #e5edff;
            max-width: 650px;
        }

        main {
            width: min(1150px, 88%);
            margin: 35px auto 65px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .page-heading h2 {
            font-size: 25px;
        }

        .back-button {
            background: white;
            color: #3157d5;
            border: 1px solid #dce4f2;
            padding: 10px 17px;
            border-radius: 9px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #eaf0ff;
        }

        .notice {
            display: none;
            padding: 14px 18px;
            margin-bottom: 22px;
            border-radius: 10px;
            font-weight: 600;
        }

        .notice.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .notice.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .notice.info {
            display: block;
            background: #dbeafe;
            color: #1e40af;
        }

        .event-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .event-card {
            background: white;
            padding: 25px;
            border: 1px solid #e5eaf2;
            border-radius: 17px;
            box-shadow: 0 8px 25px rgba(25, 45, 90, 0.06);
            transition: 0.25s ease;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 30px rgba(25, 45, 90, 0.12);
        }

        .event-category {
            display: inline-block;
            padding: 6px 13px;
            border-radius: 30px;
            background: #eaf0ff;
            color: #3157d5;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .event-card h3 {
            font-size: 21px;
            margin-bottom: 18px;
            color: #172554;
        }

        .event-details {
            display: grid;
            gap: 11px;
            padding: 15px;
            background: #f7f9fd;
            border-radius: 10px;
            margin-bottom: 17px;
            color: #475467;
            font-size: 14px;
        }

        .event-info {
            padding-top: 8px;
            color: #667085;
            font-size: 14px;
        }

        .event-info strong {
            color: #344054;
        }

        .cancel-button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #fee2e2;
            color: #b91c1c;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .cancel-button:hover {
            background: #dc2626;
            color: white;
        }

        .cancel-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .empty-state {
            grid-column: 1 / -1;
            background: white;
            padding: 55px 20px;
            border-radius: 17px;
            text-align: center;
            border: 1px solid #e5eaf2;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-state h2 {
            margin-bottom: 8px;
            color: #172554;
        }

        .empty-state p {
            color: #667085;
            margin-bottom: 20px;
        }

        .browse-button {
            display: inline-block;
            padding: 11px 20px;
            border-radius: 9px;
            background: #3157d5;
            color: white;
            font-weight: bold;
        }

        .browse-button:hover {
            background: #2343ad;
        }

        .footer {
            background: #172554;
            color: #cbd5e1;
            text-align: center;
            padding: 23px;
            font-size: 14px;
        }

        @media (max-width: 700px) {
            .navbar {
                flex-direction: column;
            }

            .event-container {
                grid-template-columns: 1fr;
            }

            main {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="logo">CampusConnect</a>

        <div class="nav-links">
            <a href="student-dashboard.html">Dashboard</a>
            <a href="events.html">Explore Events</a>
            <a href="student-details.html">My Profile</a>
            <a href="login.html" id="logoutLink">Logout</a>
        </div>
    </nav>

    <header class="hero">
        <p class="hero-label">STUDENT PORTAL</p>
        <h1>My Registered Events</h1>
        <p>
            Manage your event registrations and keep track of
            your upcoming campus activities.
        </p>
    </header>

    <main>

        <div class="page-heading">
            <h2>Your Event Registrations</h2>
            <a href="student-dashboard.html" class="back-button">
                ← Dashboard
            </a>
        </div>

        <div id="page-notice" class="notice" role="status"
             aria-live="polite"></div>

        <section id="registered-events" class="event-container">
            <div class="empty-state">
                <p>Loading your registered events...</p>
            </div>
        </section>

    </main>

    <footer class="footer">
        CampusConnect — Campus Event Portal © 2026
    </footer>

    <script>
        const studentId = localStorage.getItem("campusStudentId");

        function showNotice(message, type) {
            const notice = document.getElementById("page-notice");

            notice.textContent = message;
            notice.className = "notice " + type;

            notice.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        function clearStudentSession() {
            localStorage.removeItem("campusStudentId");
            localStorage.removeItem("campusStudentName");
            localStorage.removeItem("campusStudentEmail");
        }

        document.getElementById("logoutLink").addEventListener(
            "click",
            clearStudentSession
        );

        function loadRegisteredEvents() {
            const container = document.getElementById("registered-events");

            if (!studentId) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔒</div>
                        <h2>Please Login First</h2>
                        <p>Your student session was not found.</p>
                        <a href="login.html" class="browse-button">
                            Go to Login
                        </a>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="empty-state">
                    <p>Loading your registered events...</p>
                </div>
            `;

            fetch("/my-events?studentId=" + encodeURIComponent(studentId))
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error("Could not load registered events.");
                    }

                    return response.json();
                })
                .then(function(events) {
                    container.innerHTML = "";

                    if (!Array.isArray(events) || events.length === 0) {
                        container.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">📅</div>
                                <h2>No Registered Events</h2>
                                <p>
                                    You have not registered for any events yet.
                                    Explore campus events and join something exciting!
                                </p>
                                <a href="events.html" class="browse-button">
                                    Explore Events →
                                </a>
                            </div>
                        `;
                        return;
                    }

                    events.forEach(function(event) {
                        const card = document.createElement("article");
                        card.className = "event-card";

                        const category = document.createElement("span");
                        category.className = "event-category";
                        category.textContent = event.category || "Campus Event";

                        const title = document.createElement("h3");
                        title.textContent = event.eventName || "Untitled Event";

                        const details = document.createElement("div");
                        details.className = "event-details";

                        [
                            "📅 " + (event.date || "Date not available"),
                            "🕐 " + (event.time || "Time not available"),
                            "📍 " + (event.venue || "Venue not available")
                        ].forEach(function(value) {
                            const span = document.createElement("span");
                            span.textContent = value;
                            details.appendChild(span);
                        });

                        const organizer = document.createElement("p");
                        organizer.className = "event-info";
                        organizer.innerHTML = "<strong>Organizer:</strong> ";

                        const organizerName = document.createElement("span");
                        organizerName.textContent = event.organizer || "Not specified";
                        organizer.appendChild(organizerName);

                        const registrationDate = document.createElement("p");
                        registrationDate.className = "event-info";
                        registrationDate.innerHTML =
                            "<strong>Registration Date:</strong> ";

                        const dateText = document.createElement("span");
                        dateText.textContent =
                            event.registrationDate || "Not available";

                        registrationDate.appendChild(dateText);

                        const cancelButton = document.createElement("button");
                        cancelButton.className = "cancel-button";
                        cancelButton.textContent = "Cancel Registration";

                        cancelButton.addEventListener("click", function() {
                            cancelRegistration(
                                event.eventId,
                                event.eventName,
                                cancelButton
                            );
                        });

                        card.appendChild(category);
                        card.appendChild(title);
                        card.appendChild(details);
                        card.appendChild(organizer);
                        card.appendChild(registrationDate);
                        card.appendChild(cancelButton);

                        container.appendChild(card);
                    });
                })
                .catch(function(error) {
                    console.error(error);

                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">⚠️</div>
                            <h2>Unable to Load Events</h2>
                            <p>
                                Please check that the CampusConnect
                                Java server is running.
                            </p>
                            <button class="browse-button"
                                onclick="loadRegisteredEvents()">
                                Try Again
                            </button>
                        </div>
                    `;
                });
        }

        function cancelRegistration(eventId, eventName, button) {
            const confirmed = confirm(
                "Are you sure you want to cancel your registration for "
                + eventName + "?"
            );

            if (!confirmed) {
                return;
            }

            button.disabled = true;
            button.textContent = "Cancelling...";

            const body = new URLSearchParams({
                studentId: studentId,
                eventId: eventId
            });

            fetch("/cancel-registration", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: body.toString()
            })
            .then(function(response) {
                return response.text().then(function(message) {
                    return {
                        ok: response.ok,
                        message: message
                    };
                });
            })
            .then(function(result) {
                if (result.ok) {
                    showNotice(
                        result.message || "Registration cancelled successfully.",
                        "success"
                    );

                    loadRegisteredEvents();
                } else {
                    showNotice(
                        result.message || "Could not cancel registration.",
                        "error"
                    );

                    button.disabled = false;
                    button.textContent = "Cancel Registration";
                }
            })
            .catch(function(error) {
                console.error(error);

                showNotice(
                    "Unable to cancel registration. Please try again.",
                    "error"
                );

                button.disabled = false;
                button.textContent = "Cancel Registration";
            });
        }

        loadRegisteredEvents();
    </script>

</body>
</html>
