<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Attendance - CampusConnect</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        nav {
            background: #2563eb;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        main {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.06);
        }

        select, button {
            padding: 11px;
            border-radius: 7px;
            border: 1px solid #d1d5db;
            font-size: 15px;
        }

        select {
            max-width: 100%;
            margin: 10px 5px 10px 0;
        }

        button {
            border: none;
            cursor: pointer;
            color: white;
            background: #2563eb;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .present { background: #15803d; }
        .absent { background: #dc2626; }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th { background: #eff6ff; }

        .message {
            margin-top: 18px;
            font-weight: bold;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .count {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 14px;
            background: #dbeafe;
            color: #1e40af;
            border-radius: 7px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav>
        <strong>CampusConnect</strong>
        <div>
            <a href="organizer-dashboard.html">Dashboard</a>
            <a href="events.html">Events</a>
            <a href="login.html">Logout</a>
        </div>
    </nav>

    <main>
        <h1>Manage Attendance</h1>
        <p>Select an event to view registered students and record attendance.</p>

        <section class="panel">
            <label for="eventSelect"><strong>Select event:</strong></label>
            <br>

            <select id="eventSelect">
                <option value="">Loading events...</option>
            </select>

            <button id="loadButton" type="button">Load Students</button>

            <div>
                <span id="registrationCount" class="count">
                    Registered students: 0
                </span>
            </div>

            <p id="message" class="message" role="status" aria-live="polite">
                Loading events...
            </p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Student ID</th>
                            <th>Event</th>
                            <th>Status</th>
                            <th>Mark Attendance</th>
                        </tr>
                    </thead>

                    <tbody id="studentList">
                        <tr>
                            <td colspan="4">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const eventSelect = document.getElementById("eventSelect");
        const studentList = document.getElementById("studentList");
        const message = document.getElementById("message");
        const registrationCount = document.getElementById("registrationCount");
        const loadButton = document.getElementById("loadButton");

        loadButton.addEventListener("click", loadStudents);
        eventSelect.addEventListener("change", loadStudents);

        function addCell(row, value) {
            const cell = row.insertCell();
            cell.textContent = value ?? "";
            return cell;
        }

        async function loadEvents() {
            eventSelect.replaceChildren();

            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = "Loading events...";
            eventSelect.appendChild(placeholder);

            try {
                const response = await fetch("/events");

                if (!response.ok) {
                    throw new Error("Could not retrieve published events.");
                }

                const events = await response.json();

                eventSelect.replaceChildren();

                if (!Array.isArray(events) || events.length === 0) {
                    const option = document.createElement("option");
                    option.value = "";
                    option.textContent = "No events available";
                    eventSelect.appendChild(option);

                    studentList.replaceChildren();
                    const row = studentList.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 4;
                    cell.textContent = "No events have been published yet.";

                    registrationCount.textContent = "Registered students: 0";
                    message.textContent = "Publish an event first.";
                    return;
                }

                events.forEach(event => {
                    const option = document.createElement("option");
                    option.value = event.eventId;
                    option.textContent = event.title + " (ID: " + event.eventId + ")";
                    eventSelect.appendChild(option);
                });

                await loadStudents();

            } catch (error) {
                eventSelect.replaceChildren();

                const option = document.createElement("option");
                option.value = "";
                option.textContent = "Unable to load events";
                eventSelect.appendChild(option);

                studentList.replaceChildren();
                registrationCount.textContent = "Registered students: 0";
                message.textContent =
                    error.message + " Check that the Java server is running.";
            }
        }

        async function loadStudents() {
            const eventId = eventSelect.value;

            studentList.replaceChildren();
            registrationCount.textContent = "Registered students: ...";

            if (!eventId) {
                registrationCount.textContent = "Registered students: 0";
                message.textContent = "Select an event first.";
                return;
            }

            message.textContent = "Loading registered students...";

            try {
                const response = await fetch(
                    "/event-attendance?eventId=" + encodeURIComponent(eventId)
                );

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                const students = await response.json();

                registrationCount.textContent =
                    "Registered students: " + students.length;

                if (students.length === 0) {
                    const row = studentList.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 4;
                    cell.textContent =
                        "No students registered for this event yet.";

                    message.textContent = "0 registered students found.";
                    return;
                }

                students.forEach(student => {
                    const row = studentList.insertRow();

                    addCell(row, student.studentId);
                    addCell(row, student.eventName);
                    addCell(row, student.status || "Not marked");

                    const actions = row.insertCell();
                    const container = document.createElement("div");
                    container.className = "actions";

                    ["Present", "Absent"].forEach(status => {
                        const button = document.createElement("button");
                        button.textContent = status;
                        button.className =
                            status === "Present" ? "present" : "absent";

                        button.addEventListener("click", () => {
                            markAttendance(
                                student.studentId,
                                student.eventId,
                                status
                            );
                        });

                        container.appendChild(button);
                    });

                    actions.appendChild(container);
                });

                message.textContent =
                    students.length + " registered student(s) found.";

            } catch (error) {
                registrationCount.textContent = "Registration count unavailable";
                message.textContent =
                    "Unable to load students: " + error.message;
            }
        }

        async function markAttendance(studentId, eventId, status) {
            message.textContent = "Saving attendance...";

            try {
                const response = await fetch("/mark-attendance", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        studentId: String(studentId),
                        eventId: String(eventId),
                        status: status
                    })
                });

                const result = await response.text();

                if (!response.ok) {
                    throw new Error(result);
                }

                message.textContent = result;
                await loadStudents();

            } catch (error) {
                message.textContent =
                    "Unable to save attendance: " + error.message;
            }
        }

        loadEvents();
    </script>
</body>
</html>
